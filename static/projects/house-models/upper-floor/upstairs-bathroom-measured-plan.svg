<text x="740.00" y="725.00" font-size="17" text-anchor="start">Entire bathroom ceiling tiled</text>
<text x="45.00" y="865.00" font-size="17" text-anchor="start">The owner confirmed both depth starting points and the rightward direction of the 6¼″ measurement.</text>
<text x="45.00" y="903.00" font-size="17" text-anchor="start">Window offset, door position, fixture depths, ceiling height and hidden wall thicknesses remain inferred.</text>
<text x="45.00" y="941.00" font-size="17" text-anchor="start">Linen cupboard faces the primary doorway; the corrected layout gives ~16¾″ depth, within the stated range.</text>
<text x="45.00" y="979.00" font-size="16" text-anchor="start">Dimensions describe the approximate finished faces. This is a model review diagram.</text>
