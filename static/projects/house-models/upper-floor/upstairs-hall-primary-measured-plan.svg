<title id="title">Hallway, landing and primary bedroom measurements</title>
<desc id="desc">Rear of house at top, driveway side at left. The upstairs chimney projects 18 inches from the bedroom entry wall and has a 25-inch face parallel to the door. A queen bed sits between nightstands, about 40.5 inches from the chimney and 11 inches from the far wall, with roughly 3-inch gaps beside the headboard.</desc>
