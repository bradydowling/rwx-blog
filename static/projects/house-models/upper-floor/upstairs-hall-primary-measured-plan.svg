<text x="45.00" y="820.00" font-size="17" text-anchor="start">Primary entry-to-side-wall depth resolves to ~183¼″ (stated ~182″); closet-front span is ~140¼″ (stated ~140″).</text>
<text x="45.00" y="855.00" font-size="16" text-anchor="start">Chimney enclosures can differ by floor; concealed flue alignment is unconfirmed. Furniture dimensions and spacing are approximate.</text>
