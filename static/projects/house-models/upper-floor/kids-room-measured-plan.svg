<title id="title">Kids' room — October 1 measurements</title>
<desc id="desc">The room is 11 feet 5 inches from the primary-bedroom wall to the front-window wall and 11 feet 4 and a half inches from the entry wall to the far wall. The closet section projects 20 and five eighths inches and is 51 inches wide.</desc>
